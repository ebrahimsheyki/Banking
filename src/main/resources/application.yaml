spring:
  application:
    name: Banking

  datasource:
    url: jdbc:h2:mem:banking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

logging:
  structured:
    format:
      console: logstash

banking:
  security:
    keystore:
      path: ${BANKING_KEYSTORE_PATH}
      password: ${BANKING_KEYSTORE_PASSWORD}
      alias: ${BANKING_KEYSTORE_ALIAS:banking-jwt}

    bootstrap-users:
      admin:
        username: ${BANKING_BOOTSTRAP_ADMIN_USERNAME:ebrahim}
        password: ${BANKING_BOOTSTRAP_ADMIN_PASSWORD}
        role: ADMIN

      bank-operator:
        username: ${BANKING_BOOTSTRAP_BANK_OPERATOR_USERNAME:bank-operator}
        password: ${BANKING_BOOTSTRAP_BANK_OPERATOR_PASSWORD}
        role: BANK_OPERATOR

      customer:
        username: ${BANKING_BOOTSTRAP_CUSTOMER_USERNAME:customer}
        password: ${BANKING_BOOTSTRAP_CUSTOMER_PASSWORD}
        role: CUSTOMER